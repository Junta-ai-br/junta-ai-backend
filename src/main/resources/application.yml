spring:
  application:
    name: junta-ai-backend

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/junta_ai}
    username: ${DB_USER:junta_ai}
    password: ${DB_PASSWORD:junta_ai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-env-minimum-32-chars-long}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}      # 15 minutos
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 dias

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    chat-path: ${AI_SERVICE_CHAT_PATH:/v1/conversations/process}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

auth:
  access-code:
    expiration-minutes: ${ACCESS_CODE_EXPIRATION_MINUTES:10}

app:
  mail:
    from: ${MAIL_FROM:}
    contact-to: ${CONTACT_EMAIL_TO:}
  public-forms:
    rate-limit:
      per-client: ${PUBLIC_FORMS_RATE_LIMIT_PER_CLIENT:5}
      global: ${PUBLIC_FORMS_RATE_LIMIT_GLOBAL:100}
      window-seconds: ${PUBLIC_FORMS_RATE_LIMIT_WINDOW_SECONDS:600}
      max-clients: ${PUBLIC_FORMS_RATE_LIMIT_MAX_CLIENTS:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  level:
    br.com.juntaai: INFO
    org.springframework.security: WARN
