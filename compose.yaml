# Compose de desenvolvimento local: Postgres + Backend.
# O serviço de IA (junta-ai-ai) vive em repositório próprio; rode-o
# separadamente e aponte AI_SERVICE_BASE_URL para ele (ex.: http://localhost:8000).
services:
  postgres:
    image: postgres:16-alpine
    container_name: junta-ai-postgres
    environment:
      POSTGRES_DB: junta_ai
      POSTGRES_USER: junta_ai
      POSTGRES_PASSWORD: junta_ai
    ports:
      - "5433:5432"
    volumes:
      - junta_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junta_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: junta-ai-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/junta_ai
      DB_USER: junta_ai
      DB_PASSWORD: junta_ai
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (openssl rand -base64 48)}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      ACCESS_CODE_EXPIRATION_MINUTES: ${ACCESS_CODE_EXPIRATION_MINUTES:-10}
    ports:
      - "8080:8080"

volumes:
  junta_ai_pgdata:
