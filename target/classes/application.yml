spring:
  application:
    name: junta-ai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/junta_ai}
    username: ${DB_USER:junta_ai}
    password: ${DB_PASSWORD:junta_ai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-env-minimum-32-chars-long}
  access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}      # 15 minutos
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 dias

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    chat-path: ${AI_SERVICE_CHAT_PATH:/v1/conversations/process}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

auth:
  access-code:
    expiration-minutes: ${ACCESS_CODE_EXPIRATION_MINUTES:10}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

logging:
  level:
    br.com.juntaai: INFO
    org.springframework.security: WARN
