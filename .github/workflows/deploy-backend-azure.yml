name: CI/CD do backend Spring Boot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testar backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: junta_ai
          POSTGRES_USER: junta_ai
          POSTGRES_PASSWORD: junta_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junta_ai -d junta_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/junta_ai
      DB_USER: junta_ai
      DB_PASSWORD: junta_ai
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-the-application
      AI_SERVICE_BASE_URL: http://localhost:8000
      MAIL_HOST: smtp.example.invalid
      MAIL_PORT: 587
      MAIL_USERNAME: ci@example.invalid
      MAIL_PASSWORD: ci-placeholder
      MAIL_FROM: ci@example.invalid
      CONTACT_EMAIL_TO: ci@example.invalid
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: bash ./mvnw --batch-mode test

  publicar-imagem:
    name: Publicar imagem no GHCR
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem identificada pelo commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/junta-ai-br/junta-ai-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  implantar-no-azure:
    name: Atualizar Container App no Azure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, publicar-imagem]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Autenticar no Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar extensão do Azure Container Apps
        run: az extension add --name containerapp --upgrade --yes

      - name: Configurar acesso ao GHCR e atualizar a imagem
        env:
          APP_NAME: juntai-back-springboot
          RESOURCE_GROUP: JuntAI-BackEnd
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_REF: ghcr.io/junta-ai-br/junta-ai-backend:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GHCR_USERNAME" || -z "$GHCR_TOKEN" ]]; then
            echo "Configure os segredos GHCR_USERNAME e GHCR_TOKEN no GitHub."
            exit 1
          fi

          az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            --output none

          az containerapp registry set \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server ghcr.io \
            --username "$GHCR_USERNAME" \
            --password "$GHCR_TOKEN" \
            --only-show-errors

          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_REF" \
            --only-show-errors

          echo "Imagem implantada: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
